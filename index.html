<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramayanam Story Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700&family=Noto+Sans+Telugu:wght@400;500;700&family=Ramabhadra&family=Yatra+One&display=swap">
<style>
/* Layout: a phone-shaped game frame centred on the page. Scene art fills the top; a palm-leaf
   dialogue panel and the choices sit at the bottom. One deliberate dark look: it's a game screen. */
:root {
  --page: #120F24;
  --frame: #1F1A38;
  --frame-edge: #352D5A;
  --on-dark: #F4EBD8;
  --on-dark-muted: #B9AFCC;
  --leaf: #EBD9A6;
  --leaf-deep: #DCC386;
  --leaf-edge: #C2A262;
  --choice: #F6EBCB;
  --choice-hover: #FFF4D8;
  --ink: #3A2714;
  --ink-soft: #6B5233;
  --saffron: #E8742A;
  --gold: #E0AE3A;
  --lotus: #E58FA6;
  --c-rama: #4A6FD0;
  --c-lakshmana: #C9952A;
  --c-hanuman: #DD6526;
  --c-sugriva: #5E9446;
  --font-display: "Yatra One", "Mukta", Georgia, serif;
  --font-te-display: "Ramabhadra", "Noto Sans Telugu", "Nirmala UI", sans-serif;
  --font-body: "Mukta", "Noto Sans Telugu", "Segoe UI", system-ui, sans-serif;
  --font-te: "Noto Sans Telugu", "Nirmala UI", "Gautami", "Mukta", sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  background: var(--page);
  color: var(--on-dark);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  display: flex;
  justify-content: center;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.te { font-family: var(--font-te); }
body.te :not(.en-title) { letter-spacing: 0; }

.game {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100%;
  max-height: 860px;
  display: flex;
  flex-direction: column;
  background: var(--frame);
  border: 1px solid var(--frame-edge);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
}
.app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Top bar */
.bar {
  flex: none;
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--frame);
  border-bottom: 1px solid var(--frame-edge);
}
.bar .spacer {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--on-dark-muted);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border: 1px solid var(--frame-edge);
  border-radius: 999px;
  background: rgba(255, 255, 255, .05);
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.btn-ghost {
  font: inherit;
  font-size: 13px;
  color: var(--on-dark);
  background: transparent;
  border: 1px solid var(--frame-edge);
  border-radius: 999px;
  padding: 3px 12px;
  cursor: pointer;
}
.btn-ghost:hover { background: rgba(255, 255, 255, .06); }
.lang { display: inline-flex; border: 1px solid var(--frame-edge); border-radius: 999px; overflow: hidden; flex: none; }
.lang button {
  font: inherit;
  font-size: 13px;
  padding: 3px 10px;
  background: transparent;
  color: var(--on-dark-muted);
  border: 0;
  cursor: pointer;
}
.lang .te-btn { font-family: var(--font-te); }
.lang button[aria-pressed="true"] { background: var(--on-dark); color: var(--frame); }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

/* Play view */
.view { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.scene { position: relative; flex: 1 1 auto; min-height: 140px; overflow: hidden; cursor: pointer; }
.scene svg, .scene-bg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 45%;
  background: linear-gradient(to bottom, rgba(31, 26, 56, 0), var(--frame));
  pointer-events: none;
}
.flame { transform-origin: 200px 238px; animation: flick 1.4s ease-in-out infinite alternate; }
@keyframes flick { from { transform: scale(1, 1); } to { transform: scale(.96, 1.08); } }

/* Characters: each breathes and blinks; whoever is speaking bobs, talks and gestures */
.cast {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 30px;
  height: 80%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2%;
  padding: 0 6%;
  pointer-events: none;
}
.cast.split { justify-content: space-between; padding: 0 3%; }
.cast.right { justify-content: flex-end; padding-right: 12%; }
.cast.title-cast { top: 6%; bottom: auto; height: 36%; }
.actor {
  flex: none;
  height: 100%;
  max-height: 250px;
  aspect-ratio: 100 / 180;
  transform-origin: 50% 100%;
  transition: filter .3s ease, transform .3s ease;
}
.actor-in { width: 100%; height: 100%; animation: enter .55s cubic-bezier(.2, .8, .3, 1) backwards; animation-delay: var(--enter, 0s); }
.actor svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cast.has-speaker .actor:not(.speaking) { filter: brightness(.68) saturate(.8); transform: scale(.93); }
.scene[data-bg="night"] .actor { filter: brightness(.8) saturate(.85); }
.figure { transform-origin: 50px 172px; animation: breathe 3.4s ease-in-out infinite; }
.speaking .figure { animation: bob .9s ease-in-out infinite; }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; animation-delay: var(--blink, 0s); }
.mouth { transform-box: fill-box; transform-origin: center; transform: scaleY(.35); }
.speaking .mouth { animation: talk .26s ease-in-out infinite alternate; }
.tail { transform-origin: 60px 128px; animation: sway 2.8s ease-in-out infinite alternate; }
.actor[data-kind="human"] .arm { transform-origin: 63px 62px; }
.actor[data-kind="vanara"] .arm { transform-origin: 65px 66px; }
.speaking .arm { animation: gesture 1.6s ease-in-out infinite alternate; }
@keyframes enter { from { opacity: .15; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.018); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
@keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1.25); } }
@keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
@keyframes gesture { from { transform: rotate(0deg); } to { transform: rotate(-24deg); } }

/* Mini-games: the player's own vanara on the scene, controls on the palm leaf */
.view.gaming .talk { margin-top: 0; padding-top: 12px; }
.mg { position: absolute; inset: 0; z-index: 4; touch-action: none; user-select: none; -webkit-user-select: none; }
.mg-player { position: absolute; left: 50%; bottom: 6%; height: 30%; aspect-ratio: 100 / 180; transform: translateX(-50%); }
.mg-player.small { height: 22%; }
.mg-player.leaper { left: 45%; }
.mg-player .actor { height: 100%; max-height: none; }
.mg-player.moving .figure { animation: bob .32s ease-in-out infinite; }
.mg-bundle { position: absolute; left: 50%; top: -10%; width: 12%; aspect-ratio: 1; animation: spin 1.4s linear infinite; }
.mg-bundle.caught { animation: none; transform: translate(-50%, -50%); }
.mg-bundle svg { width: 100%; height: 100%; display: block; }
@keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
.mg-flash {
  position: absolute;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  padding: 4px 14px;
  border-radius: 999px;
  background: rgba(18, 15, 36, .9);
  color: var(--on-dark);
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  animation: toast-in .25s ease-out;
}
.mg-bar {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 12px;
  height: 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .4);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
  overflow: hidden;
}
.mg-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--gold); }
.mg-eye {
  position: absolute;
  left: 12px;
  top: 30px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(18, 15, 36, .88);
  color: var(--on-dark);
  font-size: 13px;
}
.mg-eye .dot { width: 10px; height: 10px; border-radius: 50%; background: #5FBF6A; }
.mg-eye[data-state="turn"] .dot { background: #F2B84B; }
.mg-eye[data-state="look"] .dot { background: #F0503C; box-shadow: 0 0 0 4px rgba(240, 80, 60, .3); }
.actor.alert { filter: drop-shadow(0 0 10px rgba(240, 80, 60, .95)); }
.mg-sticks { position: absolute; left: 50%; bottom: 10%; width: 34%; aspect-ratio: 2 / 1; transform: translateX(-50%); }
.mg-sticks svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mg-rub { transform-box: fill-box; transform-origin: 50% 100%; transform: rotate(-9deg); transition: transform .07s linear; }
.mg-sticks.flip .mg-rub { transform: rotate(9deg); }
.mg-flame { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(.2); opacity: 0; transition: opacity .4s ease, transform .5s ease; }
.mg-sticks.lit .mg-flame { opacity: 1; transform: scale(1); }
.spark {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #FFD27A;
  box-shadow: 0 0 6px #FFB25A;
  pointer-events: none;
  animation: spark .6s ease-out forwards;
}
@keyframes spark { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx, 0px), -70px); opacity: 0; } }
.mg-meter {
  position: absolute;
  left: 18px;
  bottom: 8%;
  width: 18px;
  height: 64%;
  border-radius: 999px;
  background: rgba(0, 0, 0, .45);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
  overflow: hidden;
}
.mg-zone { position: absolute; z-index: 1; left: 0; right: 0; bottom: 85%; height: 14%; background: rgba(224, 174, 58, .6); }
.mg-meter .mg-fill { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 0; background: var(--saffron); }
.game-panel { gap: 6px; }
.mg-title { margin: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.2; color: var(--ink); }
body.te .mg-title { font-family: var(--font-te-display); }
.mg-status { margin: 0; min-height: 1.5em; font-size: 14px; font-weight: 700; color: #8A4B12; font-variant-numeric: tabular-nums; }
.mg-controls { display: flex; gap: 10px; margin-top: 4px; }
.mg-btn {
  flex: 1;
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  padding: 12px 10px;
  color: var(--ink);
  background: var(--choice);
  border: 1.5px solid var(--leaf-edge);
  border-radius: 12px;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.mg-btn.on, .mg-btn:active { background: var(--gold); }

.talk {
  flex: 0 1 auto;
  max-height: 66%;
  overflow-y: auto;
  position: relative;
  z-index: 2;
  margin-top: -40px;
  padding: 0 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.speaker {
  align-self: flex-start;
  position: relative;
  z-index: 3;
  margin: 0 0 -20px 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 3px 14px 3px 3px;
  border: 1px solid var(--frame-edge);
  border-radius: 999px;
  background: var(--frame);
  font-size: 14px;
  font-weight: 700;
}
.face {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 700;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35);
}
.leaf {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 100px;
  padding: 24px 30px 14px;
  color: var(--ink);
  background-color: var(--leaf);
  background-image:
    repeating-linear-gradient(180deg, rgba(110, 80, 30, .08) 0 1px, transparent 1px 6px),
    linear-gradient(180deg, var(--leaf), var(--leaf-deep));
  border: 1px solid var(--leaf-edge);
  border-radius: 16px;
  cursor: pointer;
}
.leaf.waiting { cursor: default; }
/* The two string holes of a palm-leaf manuscript */
.leaf::before, .leaf::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-top: -4px;
  border-radius: 50%;
  background: var(--frame);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .55);
}
.leaf::before { left: 11px; }
.leaf::after { right: 11px; }
.text { margin: 0; font-size: 17px; line-height: 1.55; animation: rise .28s ease-out; }
body.te .text { font-size: 16.5px; line-height: 1.8; }
@keyframes rise { from { opacity: .35; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.tap { margin: 0; font-size: 12px; color: var(--ink-soft); text-align: right; letter-spacing: .04em; }
.verse {
  margin: 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, .38);
  color: var(--ink);
  line-height: 1.7;
}
.verse[lang="sa"] { font-family: var(--font-display); font-size: 17px; }
.verse[lang="te"] { font-family: var(--font-te-display); font-size: 16px; line-height: 1.9; }
.verse .src {
  display: block;
  margin-top: 6px;
  font-family: var(--font-body);
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--ink-soft);
  letter-spacing: .04em;
}
body.te .verse .src { font-family: var(--font-te); }

.choices { display: flex; flex-direction: column; gap: 8px; }
.choice {
  font: inherit;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  text-align: left;
  font-size: 15.5px;
  line-height: 1.4;
  color: var(--ink);
  background: var(--choice);
  border: 1px solid var(--leaf-edge);
  border-radius: 12px;
  cursor: pointer;
  transition: transform .12s ease, background-color .12s ease;
}
.choice:hover { background: var(--choice-hover); transform: translateY(-1px); }
.choice .ctext { flex: 1; min-width: 0; }
.choice.premium { border: 1.5px solid var(--gold); background: linear-gradient(180deg, #FFF3D1, #F4DFA8); }
.choice.locked { opacity: .6; cursor: not-allowed; }
.choice.locked:hover { transform: none; }
.cost {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 14px;
  font-weight: 700;
  color: #8A4B12;
  font-variant-numeric: tabular-nums;
}

/* Toasts */
.toasts {
  position: absolute;
  top: 54px;
  left: 12px;
  right: 12px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.toast {
  max-width: 100%;
  padding: 6px 14px;
  border: 1px solid var(--on-dark-muted);
  border-radius: 999px;
  background: rgba(18, 15, 36, .94);
  color: var(--on-dark);
  font-size: 13.5px;
  text-align: center;
  animation: toast-in .25s ease-out;
}
.toast[data-k="hanuman"] { border-color: var(--c-hanuman); }
.toast[data-k="sugriva"] { border-color: var(--c-sugriva); }
.toast[data-k="lakshmana"] { border-color: var(--c-lakshmana); }
.toast[data-k="v"] { border-color: var(--gold); }
.toast[data-k="lotus"] { border-color: var(--lotus); }
@keyframes toast-in { from { opacity: .4; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

/* Bonds sheet */
.overlay { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(12, 10, 26, .72); }
.sheet {
  width: 100%;
  max-height: 85%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 18px 18px 22px;
  background: var(--frame);
  border-top: 1px solid var(--frame-edge);
  border-radius: 18px 18px 0 0;
}
.sheet h2, .block h3 {
  margin: 4px 0 0;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--on-dark-muted);
}
.stat { display: grid; grid-template-columns: 38% 1fr 24px; align-items: center; gap: 10px; font-size: 14.5px; }
.track { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.fill { display: block; height: 100%; border-radius: inherit; }
.num { text-align: right; color: var(--on-dark-muted); font-variant-numeric: tabular-nums; }

/* Title screen */
.title-screen { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.scene-bg { position: absolute; inset: 0; }
.title-screen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(31, 26, 56, 0) 10%, rgba(31, 26, 56, .75) 45%, var(--frame) 68%);
  pointer-events: none;
}
.title-body { position: relative; z-index: 2; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 24px 22px 22px; }
.te-title { margin: 0; font-family: var(--font-te-display); font-weight: 400; font-size: clamp(44px, 13vw, 60px); line-height: 1.2; color: var(--on-dark); }
.en-title { margin: -8px 0 0; font-family: var(--font-display); font-size: 18px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
.chap { margin: 4px 0 0; font-size: 13.5px; color: var(--on-dark-muted); }
.chap strong { color: var(--on-dark); font-weight: 500; }
.premise { margin: 0; max-width: 38ch; font-size: 15.5px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; color: var(--on-dark-muted); }
.field input {
  font: inherit;
  font-size: 16px;
  padding: 10px 12px;
  color: var(--on-dark);
  background: rgba(255, 255, 255, .06);
  border: 1px solid var(--frame-edge);
  border-radius: 10px;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  font: inherit;
  font-size: 16px;
  font-weight: 700;
  padding: 10px 22px;
  color: #1B0F05;
  background: var(--saffron);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
}
.btn.secondary { color: var(--on-dark); background: transparent; border: 1px solid var(--frame-edge); font-weight: 500; }
.note { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--on-dark-muted); }
.note svg { flex: none; }

/* End screen */
.end { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 24px; }
.kicker { margin: 0; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--on-dark-muted); }
.label { margin: 0 0 2px; font-size: 12.5px; color: var(--on-dark-muted); }
.earned { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; color: var(--gold); }
body.te .earned { font-family: var(--font-te-display); }
.desc { margin: 0; }
.block { display: flex; flex-direction: column; gap: 10px; }
.recap { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.small { margin: 0; font-size: 13.5px; color: var(--on-dark-muted); }
.small strong { color: var(--on-dark); font-weight: 500; }
.teaser { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1px dashed var(--frame-edge); border-radius: 14px; }
.teaser span:last-child { font-size: 12.5px; color: var(--on-dark-muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="game">
  <div class="app" id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Text ---------- */
  var UI = {
    chapter: { en: "Chapter 1", te: "అధ్యాయం 1" },
    chapterName: { en: "The Bundle in Yellow Silk", te: "పసుపు పట్టులో మూట" },

  function lotusFlower(x, y, k) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + k + ')">' +
      '<ellipse cx="0" cy="4" rx="14" ry="3.5" fill="#3F7A4A"/>' +
      '<path d="M0 -10C-5 -4 -5 2 0 4C5 2 5 -4 0 -10Z" fill="#F2A3B8"/>' +
      '<path d="M0 4C-7 3 -11 -1 -12 -6C-6 -5 -2 -1 0 4Z" fill="#E07F9B"/>' +
      '<path d="M0 4C7 3 11 -1 12 -6C6 -5 2 -1 0 4Z" fill="#E07F9B"/></g>';
  }

  function sceneSVG(bg) {
    var p = PAL[bg];
    var defs = '<linearGradient id="sky-' + bg + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + p.sky[0] + '"/><stop offset=".62" stop-color="' + p.sky[1] + '"/><stop offset="1" stop-color="' + p.sky[2] + '"/></linearGradient>';
    var body = '<rect width="400" height="300" fill="url(#sky-' + bg + ')"/>';
    if (bg === "dawn") {
      body += '<circle cx="232" cy="128" r="30" fill="#FFE0A0"/>' +
        '<path d="' + FAR + '" fill="' + p.far + '"/><path d="' + NEAR + '" fill="' + p.near + '"/>';
    } else if (bg === "lake") {
      body += '<path d="' + FAR + '" fill="' + p.far + '"/>' +
        '<rect x="0" y="210" width="400" height="90" fill="#3A6F80"/>' +
        '<path d="M40 238H110M200 252H290M300 230H370M90 272H170" stroke="#9CC9D3" stroke-width="1.2" stroke-linecap="round" fill="none" opacity=".6"/>' +
        lotusFlower(70, 250, 1) + lotusFlower(150, 236, 0.7) + lotusFlower(300, 262, 1.1) + lotusFlower(352, 242, 0.6) +
        '<g stroke="' + p.near + '" stroke-width="2.4" stroke-linecap="round" fill="none">' +
        '<path d="M8 300Q12 250 4 214"/><path d="M18 300Q20 258 26 222"/><path d="M28 300Q30 266 22 238"/>' +
        '<path d="M372 300Q370 256 380 220"/><path d="M386 300Q388 262 396 232"/></g>';
    } else if (bg === "peak") {
      body += '<path d="' + LOW + '" fill="' + p.far + '"/>' +
        '<path d="M0 300L0 206L38 192L92 200L148 232L176 300Z" fill="' + p.near + '"/>';
    } else if (bg === "fire" || bg === "dusk") {
      var lit = bg === "fire";
      if (lit) defs += '<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB25A" stop-opacity=".55"/><stop offset="1" stop-color="#FFB25A" stop-opacity="0"/></radialGradient>';
      body += '<path d="' + FAR + '" fill="' + p.far + '"/>' +
        (lit ? '<circle cx="200" cy="232" r="120" fill="url(#glow)"/>' : "") +
        '<path d="M0 246Q200 230 400 246L400 300L0 300Z" fill="' + p.near + '"/>' +
        '<g fill="#4A2A1A"><rect x="172" y="236" width="56" height="7" rx="3" transform="rotate(-12 200 240)"/><rect x="172" y="236" width="56" height="7" rx="3" transform="rotate(12 200 240)"/></g>' +
        (lit ? '<g class="flame"><path d="M200 176C182 204 176 222 186 238L214 238C224 222 218 204 200 176Z" fill="#E8662A"/>' +
          '<path d="M200 198C191 213 189 227 194 238L206 238C211 227 209 213 200 198Z" fill="#FFD27A"/></g>' : "");
    } else if (bg === "night") {
      for (var i = 0; i < 46; i++) {
        body += '<circle cx="' + ((i * 89 + 17) % 400) + '" cy="' + ((i * 47 + 11) % 165) + '" r="' + ((i % 3) * 0.45 + 0.6) +
          '" fill="#FFF7E0" opacity="' + (0.45 + (i % 4) * 0.13).toFixed(2) + '"/>';
      }
      body += '<circle cx="318" cy="62" r="17" fill="#F3E9CF"/>' +
        '<path d="' + FAR + '" fill="' + p.far + '"/><path d="' + NEAR + '" fill="' + p.near + '"/>';
    }
    return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>' + defs + '</defs>' + body + '</svg>';
  }

  /* ---------- Characters ---------- */
  function eyes(y) {
    return '<g class="eyes">' +
      '<ellipse cx="45" cy="' + y + '" rx="2.8" ry="2.2" fill="#FFF8EC"/><circle cx="45" cy="' + (y + 0.3) + '" r="1.4" fill="#1A1210"/>' +
      '<ellipse cx="55" cy="' + y + '" rx="2.8" ry="2.2" fill="#FFF8EC"/><circle cx="55" cy="' + (y + 0.3) + '" r="1.4" fill="#1A1210"/></g>';
  }

  // Rama and Lakshmana: bark-cloth exiles with matted hair and a bow over the shoulder
  function human(o) {
    return '<svg viewBox="0 0 100 180" aria-hidden="true"><g class="figure">' +
      '<path d="M74 16Q98 86 74 158" fill="none" stroke="#6B4423" stroke-width="3.5" stroke-linecap="round"/>' +
      '<path d="M74 16L74 158" stroke="#EADFC4" stroke-width="1"/>' +
      '<path d="M35 96L65 96L71 166L29 166Z" fill="' + o.cloth + '"/>' +
      '<ellipse cx="40" cy="170" rx="7" ry="3.5" fill="' + o.skin + '"/><ellipse cx="60" cy="170" rx="7" ry="3.5" fill="' + o.skin + '"/>' +
      '<path d="M37 62Q28 82 31 102" fill="none" stroke="' + o.skin + '" stroke-width="8" stroke-linecap="round"/>' +
      '<path d="M35 60Q50 53 65 60L66 99L34 99Z" fill="' + o.skin + '"/>' +
      '<path d="M38 60L64 96" stroke="' + o.sash + '" stroke-width="5" stroke-linecap="round"/>' +
      '<rect x="33" y="94" width="34" height="6" rx="2" fill="' + o.sash + '"/>' +
      '<path class="arm" d="M63 62Q72 82 69 102" fill="none" stroke="' + o.skin + '" stroke-width="8" stroke-linecap="round"/>' +
      '<rect x="45" y="48" width="10" height="10" fill="' + o.skin + '"/>' +
      '<circle cx="50" cy="38" r="14" fill="' + o.skin + '"/>' +
      '<path d="M36 36Q38 22 50 22Q62 22 64 36Q58 28 50 28Q42 28 36 36Z" fill="' + o.hair + '"/>' +
      '<ellipse cx="50" cy="18" rx="8" ry="7" fill="' + o.hair + '"/>' +
      '<path d="M50 28L50 33" stroke="#C8322A" stroke-width="1.6" stroke-linecap="round"/>' +
      eyes(39) +
      '<ellipse class="mouth" cx="50" cy="46" rx="3.2" ry="1.8" fill="#5A1E1A"/>' +
      '</g></svg>';
  }

  // Hanuman and Sugriva: vanaras with a swaying tail
  function vanara(o) {
    var mace = o.mace
      ? '<path d="M22 122L30 52" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="31" cy="45" r="9" fill="#D9A62E" stroke="#9A6E1A" stroke-width="1.5"/>'
      : "";
    var crown = o.crown ? '<path d="M38 26L42 16L46 24L50 14L54 24L58 16L62 26Z" fill="#E0AE3A"/>' : "";
    return '<svg viewBox="0 0 100 180" aria-hidden="true"><g class="figure">' +
      '<path class="tail" d="M60 128C88 136 98 98 86 76C80 66 88 56 95 61" fill="none" stroke="' + o.fur + '" stroke-width="6" stroke-linecap="round"/>' +
      mace +
      '<path d="M38 120L36 166M62 120L64 166" stroke="' + o.fur + '" stroke-width="10" stroke-linecap="round"/>' +
      '<ellipse cx="35" cy="170" rx="8" ry="4" fill="' + o.fur + '"/><ellipse cx="65" cy="170" rx="8" ry="4" fill="' + o.fur + '"/>' +
      '<path d="M35 66Q24 90 28 112" fill="none" stroke="' + o.fur + '" stroke-width="9" stroke-linecap="round"/>' +
      '<path d="M34 64Q50 56 66 64L68 108Q50 114 32 108Z" fill="' + o.fur + '"/>' +
      '<ellipse cx="50" cy="86" rx="11" ry="14" fill="' + o.face + '" opacity=".55"/>' +
      '<path d="M32 104Q50 110 68 104L70 128Q50 134 30 128Z" fill="' + o.cloth + '"/>' +
      '<path class="arm" d="M65 66Q76 90 72 112" fill="none" stroke="' + o.fur + '" stroke-width="9" stroke-linecap="round"/>' +
      '<circle cx="34" cy="38" r="6" fill="' + o.fur + '"/><circle cx="66" cy="38" r="6" fill="' + o.fur + '"/>' +
      '<circle cx="50" cy="38" r="16" fill="' + o.fur + '"/>' +
      '<ellipse cx="50" cy="44" rx="11" ry="9" fill="' + o.face + '"/>' +
      '<ellipse cx="50" cy="34" rx="10" ry="5" fill="' + o.face + '"/>' +
      crown +
      eyes(35) +
      '<ellipse class="mouth" cx="50" cy="48" rx="3.4" ry="2" fill="#5A1E1A"/>' +
      '</g></svg>';
  }

  var ACTORS = {
    rama: { kind: "human", svg: human({ skin: "#3D5FA8", hair: "#1E1712", cloth: "#8A6A3A", sash: "#D9A62E" }) },
    lakshmana: { kind: "human", svg: human({ skin: "#D9A066", hair: "#2A1A12", cloth: "#7E6034", sash: "#B5502A" }) },
    hanuman: { kind: "vanara", svg: vanara({ fur: "#C8551E", face: "#F0A36A", cloth: "#E8B23A", mace: true }) },
    sugriva: { kind: "vanara", svg: vanara({ fur: "#A77A34", face: "#E2C08A", cloth: "#4F7F3A", crown: true }) }
  };
  // Who stands in each scene, and how they're spread around the fire or the peak edge
  var CAST = {
    g_creep: ["lakshmana", "rama"],
    n1b: ["lakshmana", "rama"],
    n2: ["hanuman", "sugriva"],
    n2c: ["sugriva"],
    n3a: ["hanuman", "rama", "lakshmana"],
    n3water: ["rama", "lakshmana"],
    n3step: ["hanuman", "lakshmana"],
    n3b: ["sugriva"],
    n3b2: ["sugriva"],
    n4: ["rama", "hanuman", "sugriva"],
    g_kindle: ["hanuman"],
    n4f: ["rama", "sugriva"],
    n4b: ["rama", "sugriva"],
    n4c: ["lakshmana", "rama"],
    n5: ["rama", "lakshmana"],
    n6: ["hanuman"],
    n6a: ["hanuman"],
    g_leap: ["hanuman"],
    n6b: ["hanuman"]
  };
  var LAYOUT = {
    g_creep: "right", g_kindle: "right",
    n4f: "split", n4b: "split", n4c: "split", n5: "split",
    n6: "right", n6a: "right", g_leap: "right", n6b: "right"
  };

  function castMarkup(ids, who, layout) {
    if (!ids.length) return "";
    var any = ids.indexOf(who) > -1;
    return '<div class="cast ' + (layout || "") + (any ? " has-speaker" : "") + '" id="cast">' +
      ids.map(function (id, i) {
        return '<div class="actor' + (id === who ? " speaking" : "") + '" data-who="' + id + '" data-kind="' + ACTORS[id].kind +
          '" style="--enter:' + (i * 0.12) + 's;--blink:' + (i * 1.3) + 's"><div class="actor-in">' + ACTORS[id].svg + '</div></div>';
      }).join("") + '</div>';
  }

  /* ---------- State ---------- */
  var START_LOTUS = 8;
  var SAVE_KEY = "ramayanam-ch1-v1";
  var app = document.getElementById("app");
  var toastBox = document.getElementById("toasts");

  function fresh(keep) {
    return {
      screen: "title",
      lang: keep && keep.lang ? keep.lang : "en",
      name: keep && keep.name ? keep.name : "",
      lotus: START_LOTUS,
      bonds: { hanuman: 0, sugriva: 0, lakshmana: 0 },
      virtues: { courage: 0, wisdom: 0, compassion: 0 },
      flags: {},
      node: "n1",
      line: 0,
      picks: []
    };
  }
  var s = fresh();
  var resumeTo = null;
  var hasSave = false;
  var overlay = false;

  function t(obj) { return obj[s.lang] != null ? obj[s.lang] : obj.en; }
  function fill(str, vars) { return String(str).replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }); }
  function esc(x) {
    return String(x).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function playerName() { var n = (s.name || "").trim(); return n || t(UI.defaultName); }
  function say(obj) { return esc(fill(t(obj), { name: playerName() })); }

  // Lines can depend on what happened earlier (a mini-game result, a choice)
  function linesOf(node) {
    var all = node.lines || [];
    var out = all.filter(function (l) { return (!l.if || s.flags[l.if]) && (!l.unless || !s.flags[l.unless]); });
    return out.length ? out : all.slice(0, 1);
  }
  function curWho() {
    var node = STORY[s.node];
    if (node.game) return null;
    var line = linesOf(node)[s.line];
    return line ? line.who : null;
  }

  function save() {
    try {
      var data = JSON.parse(JSON.stringify(s));
      if (data.screen === "title") data.screen = resumeTo || "title";
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function load() {
    try { var raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  /* ---------- Views ---------- */
  function bar() {
    var lotus = s.screen === "title" ? "" :
      '<span class="pill" title="' + esc(t(UI.lotuses)) + '">' + LOTUS_SVG + '<span>' + s.lotus + '</span></span>';
    var mid = s.screen === "play" ? t(UI.chapter) + " · " + t(UI.chapterName) : "";
    var bonds = s.screen === "play" ? '<button class="btn-ghost" id="open-bonds" type="button">' + esc(t(UI.bonds)) + '</button>' : "";
    return '<div class="bar">' + lotus + '<span class="spacer">' + esc(mid) + '</span>' + bonds +
      '<div class="lang" role="group" aria-label="Language">' +
      '<button type="button" data-lang="en" aria-pressed="' + (s.lang === "en") + '">EN</button>' +
      '<button type="button" class="te-btn" data-lang="te" aria-pressed="' + (s.lang === "te") + '">తెలుగు</button>' +
      '</div></div>';
  }

  function titleView() {
    var actions = hasSave
      ? '<button class="btn" id="continue" type="button">' + esc(t(UI.cont)) + '</button><button class="btn secondary" id="begin" type="button">' + esc(t(UI.newGame)) + '</button>'
      : '<button class="btn" id="begin" type="button">' + esc(t(UI.begin)) + '</button>';
    return '<section class="title-screen"><div class="scene-bg">' + sceneSVG("dawn") +
      castMarkup(["lakshmana", "rama", "hanuman"], null, "title-cast") + '</div>' +
      '<div class="title-body">' +
      '<h1 class="te-title" lang="te">రామాయణం</h1>' +
      '<p class="en-title">Ramayanam</p>' +
      '<p class="chap"><strong>' + esc(t(UI.chapter)) + '</strong> · ' + esc(t(UI.chapterName)) + '</p>' +
      '<p class="premise">' + esc(t(UI.premise)) + '</p>' +
      '<div class="field"><label for="player-name">' + esc(t(UI.nameLabel)) + '</label>' +
      '<input id="player-name" type="text" maxlength="24" autocomplete="off" value="' + esc(s.name) + '" placeholder="' + esc(t(UI.defaultName)) + '"></div>' +
      '<div class="actions">' + actions + '</div>' +
      '<p class="note">' + LOTUS_SVG + '<span>' + esc(t(UI.lotusNote)) + '</span></p>' +
      '</div></section>';
  }

  function choiceButtons(node) {
    return node.choices.map(function (c, i) {
      if (c.cond && !s.flags[c.cond]) return "";
      var locked = c.cost && s.lotus < c.cost;
      var cost = c.cost ? '<span class="cost">' + LOTUS_SVG + (locked ? esc(fill(t(UI.need), { n: c.cost })) : c.cost) + '</span>' : "";
      return '<button type="button" class="choice' + (c.cost ? " premium" : "") + (locked ? " locked" : "") + '" data-choice="' + i + '"' +
        (locked ? ' aria-disabled="true"' : "") + '><span class="ctext">' + say(c) + '</span>' + cost + '</button>';
    }).join("");
  }

  function playView() {
    var node = STORY[s.node];
    return '<section class="view' + (node.game ? " gaming" : "") + '"><div class="scene" id="scene" data-node="' + s.node + '" data-bg="' + node.bg + '">' +
      sceneSVG(node.bg) + castMarkup(CAST[s.node] || [], curWho(), LAYOUT[s.node]) +
      (node.game ? '<div class="mg" id="mg"></div>' : "") + '</div>' +
      '<div class="talk" id="talk">' + talkHTML() + '</div></section>';
  }

  // Marks the current speaker without rebuilding the scene, so animations keep running
  function setSpeaking() {
    var cast = document.getElementById("cast");
    if (!cast) return;
    var who = curWho();
    var any = false;
    cast.querySelectorAll(".actor").forEach(function (a) {
      var on = a.getAttribute("data-who") === who;
      a.classList.toggle("speaking", on);
      if (on) any = true;
    });
    cast.classList.toggle("has-speaker", any);
  }

  function talkHTML() {
    var node = STORY[s.node];
    if (node.game) {
      var g = G[node.game];
      return '<div class="leaf waiting game-panel"><p class="mg-title">' + esc(t(g.title)) + '</p>' +
        '<p class="text">' + esc(t(g.help)) + '</p>' +
        '<p class="mg-status" id="mg-status" aria-live="polite"></p>' + g.controls() + '</div>';
    }
    var lines = linesOf(node);
    if (s.line > lines.length - 1) s.line = lines.length - 1;
    var line = lines[s.line];
    var last = s.line === lines.length - 1;
    var waiting = last && !!node.choices;
    var p = line.who !== N ? PEOPLE[line.who] : null;
    var speaker = p ? '<div class="speaker"><span class="face" style="background:' + p.color + '" aria-hidden="true">' + esc(t(p.glyph)) + '</span><span>' + esc(t(p)) + '</span></div>' : "";
    var verse = line.verse
      ? '<blockquote class="verse" lang="' + (s.lang === "te" ? "te" : "sa") + '">' + line.verse[s.lang].map(esc).join("<br>") +
        '<span class="src">' + esc(t(UI.source)) + '</span></blockquote>'
      : "";
    var tap = waiting ? "" : '<p class="tap">' + esc(t(UI.tap)) + ' ›</p>';
    var leaf = '<div class="leaf' + (waiting ? " waiting" : "") + '" id="leaf"' + (waiting ? "" : ' role="button" tabindex="0"') + '>' +
      verse + '<p class="text">' + say(line) + '</p>' + tap + '</div>';
    var choices = waiting ? '<div class="choices">' + choiceButtons(node) + '</div>' : "";
    return speaker + leaf + choices;
  }

  function statRows(kind) {
    var rows = kind === "b"
      ? BONDS.map(function (k) { return [t(PEOPLE[k]), s.bonds[k], PEOPLE[k].color]; })
      : Object.keys(VIRTUES).map(function (k) { return [t(VIRTUES[k]), s.virtues[k], "var(--gold)"]; });
    return rows.map(function (r) {
      return '<div class="stat"><span>' + esc(r[0]) + '</span><span class="track"><span class="fill" style="width:' +
        Math.min(100, r[1] / 5 * 100) + '%;background:' + r[2] + '"></span></span><span class="num">' + r[1] + '</span></div>';
    }).join("");
  }

  function endView() {
    var best = ["hanuman", "lakshmana", "sugriva"].reduce(function (a, b) { return s.bonds[b] > s.bonds[a] ? b : a; });
    var vBest = Object.keys(VIRTUES).reduce(function (a, b) { return s.virtues[b] > s.virtues[a] ? b : a; });
    var T = TITLES[best];
    var recap = s.picks.map(function (pk) { return '<li>' + say(STORY[pk[0]].choices[pk[1]]) + '</li>'; }).join("");
    return '<section class="end">' +
      '<p class="kicker">' + esc(t(UI.endTitle)) + '</p>' +
      '<div><p class="label">' + esc(t(UI.yourTitle)) + '</p><h2 class="earned">' + esc(t(T.name)) + '</h2></div>' +
      '<p class="desc">' + esc(t(T.desc)) + '</p>' +
      '<div class="block"><h3>' + esc(t(UI.bonds)) + '</h3>' + statRows("b") + '</div>' +
      '<div class="block"><h3>' + esc(t(UI.virtues)) + '</h3>' + statRows("v") +
      '<p class="small">' + esc(t(UI.strongest)) + ': <strong>' + esc(t(VIRTUES[vBest])) + '</strong></p></div>' +
      '<div class="block"><h3>' + esc(t(UI.yourChoices)) + '</h3><ol class="recap">' + recap + '</ol></div>' +
      '<p class="small">' + esc(t(UI.lotusLeft)) + ': <strong>' + s.lotus + '</strong></p>' +
      '<div class="teaser"><span>' + esc(t(UI.next)) + '</span><span>' + esc(t(UI.soon)) + '</span></div>' +
      '<div class="actions"><button class="btn" id="again" type="button">' + esc(t(UI.again)) + '</button></div>' +
      '</section>';
  }

  function sheetView() {
    return '<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(t(UI.bonds)) + '">' +
      '<h2>' + esc(t(UI.bonds)) + '</h2>' + statRows("b") +
      '<h2>' + esc(t(UI.virtues)) + '</h2>' + statRows("v") +
      '<div class="actions"><button class="btn" id="close-sheet" type="button">' + esc(t(UI.close)) + '</button>' +
      '<button class="btn secondary" id="restart" type="button">' + esc(t(UI.restart)) + '</button></div>' +
      '</div></div>';
  }

  function render() {
    stopGame();
    document.documentElement.lang = s.lang === "te" ? "te" : "en";
    document.body.classList.toggle("te", s.lang === "te");
    var view = s.screen === "title" ? titleView() : s.screen === "end" ? endView() : playView();
    app.innerHTML = bar() + view + (overlay ? sheetView() : "");
    wire();
    if (s.screen === "play" && STORY[s.node].game && !overlay) startGame();
  }

  /* ---------- Mini-games ---------- */
  var G = {
    catch: {

  var PLAYER_SVG = vanara({ fur: "#7A5A3C", face: "#D8B48A", cloth: "#5B4C9A" });

    '<path d="M14 15Q20 4 26 15" fill="#E8C43A" stroke="#B8901A" stroke-width="1.5"/><circle cx="20" cy="14" r="3" fill="#C9302C"/></svg>';

  var GAMES = {};

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function listen(el, type, fn) { el.addEventListener(type, fn); return function () { el.removeEventListener(type, fn); }; }
  function loop(fn) {
    var on = true, id = 0, last = performance.now();
    function step(now) {
      if (!on) return;
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      fn(dt);
      if (on) id = requestAnimationFrame(step);
    }
    id = requestAnimationFrame(step);
    return function () { on = false; cancelAnimationFrame(id); };
  }
  function playerSprite(cls) {
    return '<div class="mg-player ' + (cls || "") + '"><div class="actor" data-kind="vanara">' + PLAYER_SVG + '</div></div>';

  function flash(layer, msg) {

    setTimeout(function () { el.remove(); }, 900);
  }
  // Press-and-hold from buttons or the picture itself, plus the given keys
  function holdInput(targets, keys, on, off) {
    var offs = [];
    targets.forEach(function (el) {
      if (!el) return;
      offs.push(listen(el, "pointerdown", function (e) { e.preventDefault(); el.classList.add("on"); on(); }));
      ["pointerup", "pointercancel", "pointerleave"].forEach(function (type) {
        offs.push(listen(el, type, function () { el.classList.remove("on"); off(); }));
      });
    });
    if (keys.length) {
      offs.push(listen(document, "keydown", function (e) { if (keys.indexOf(e.key) > -1) { e.preventDefault(); if (!e.repeat) on(); } }));
      offs.push(listen(document, "keyup", function (e) { if (keys.indexOf(e.key) > -1) { e.preventDefault(); off(); } }));
    }
    return function () { offs.forEach(function (f) { f(); }); };
  }
  function cleanup(stopLoop, timers, offs) {
    return { stop: function () { stopLoop(); timers.forEach(clearTimeout); offs.forEach(function (f) { f(); }); } };
  }

  GAMES.catch = function (layer, status, done) {
    layer.innerHTML = '<div class="mg-bundle">' + BUNDLE_SVG + '</div>' + playerSprite();
    var bundle = layer.querySelector(".mg-bundle");
    var player = layer.querySelector(".mg-player");
    var timers = [], offs = [];
    var px = 50, target = null, dir = 0, misses = 0, tries = 3, over = false;
    var x0 = 50, phase = 0, by = -10, bx = 50, wait = 0.5;
    function drop() { x0 = rand(18, 82); phase = rand(0, 6); by = -10; wait = 0.6; }
    function show() { status.textContent = fill(t(G.catch.status), { n: tries - misses }); }
    function aim(e) {
      var r = layer.getBoundingClientRect();
      target = clamp((e.clientX - r.left) / r.width * 100, 8, 92);
      dir = 0;
    }
    offs.push(listen(layer, "pointerdown", aim), listen(layer, "pointermove", aim));
    app.querySelectorAll("[data-dir]").forEach(function (b) {
      var v = +b.getAttribute("data-dir");
      offs.push(holdInput([b], [], function () { dir = v; target = null; }, function () { if (dir === v) dir = 0; }));
    });
    offs.push(listen(document, "keydown", function (e) {
      if (e.key === "ArrowLeft" || e.key === "a") { dir = -1; target = null; }
      if (e.key === "ArrowRight" || e.key === "d") { dir = 1; target = null; }
    }), listen(document, "keyup", function (e) {
      if ((e.key === "ArrowLeft" || e.key === "a") && dir < 0) dir = 0;
      if ((e.key === "ArrowRight" || e.key === "d") && dir > 0) dir = 0;
    }));
    show();
    drop();
    var stopLoop = loop(function (dt) {
      if (dir) px += dir * 80 * dt;
      else if (target != null) { var d = target - px; px += (d > 0 ? 1 : -1) * Math.min(Math.abs(d), 120 * dt); }
      px = clamp(px, 8, 92);
      player.style.left = px + "%";
      if (over) return;
      if (wait > 0) { wait -= dt; bundle.style.visibility = "hidden"; return; }
      bundle.style.visibility = "visible";
      by += (30 + misses * 4) * dt;
      bx = clamp(x0 + Math.sin(by / 13 + phase) * 13, 8, 92);
      bundle.style.left = bx + "%";
      bundle.style.top = by + "%";
      if (by >= 62 && by <= 74 && Math.abs(bx - px) < 9) {
        over = true;
        bundle.classList.add("caught");
        status.textContent = t(G.catch.got);
        timers.push(setTimeout(function () { done({ misses: misses }); }, 800));
      } else if (by > 92) {
        misses++;
        flash(layer, t(G.catch.miss));
        if (misses >= tries) {
          over = true;
          bundle.style.visibility = "hidden";
          timers.push(setTimeout(function () { done({ misses: misses, failed: true }); }, 900));
        } else {
          show();
          drop();
        }
      }
    });
    return cleanup(stopLoop, timers, offs);
  };

  GAMES.creep = function (layer, status, done) {
    layer.innerHTML = '<div class="mg-bar"><span class="mg-fill"></span></div>' +
      '<div class="mg-eye" data-state="away"><span class="dot"></span><span class="lbl"></span></div>' + playerSprite("small");
    var fillEl = layer.querySelector(".mg-fill");
    var eye = layer.querySelector(".mg-eye");
    var lbl = eye.querySelector(".lbl");
    var player = layer.querySelector(".mg-player");
    var watcher = document.querySelector('.actor[data-who="lakshmana"]');
    var timers = [], offs = [];
    var state = "away", clock = rand(1.4, 2.6), progress = 0, holding = false, spotted = 0, freeze = 0, over = false;
    function setState(st) {
      state = st;
      eye.setAttribute("data-state", st);
      lbl.textContent = t(G.creep[st]);
      if (watcher) watcher.classList.toggle("alert", st === "look");
    }
    function show() { status.textContent = fill(t(G.creep.status), { n: spotted }); }
    setState("away");
    show();
    offs.push(holdInput([app.querySelector("[data-hold]"), layer], [" ", "ArrowDown"],
      function () { holding = true; }, function () { holding = false; }));
    offs.push(function () { if (watcher) watcher.classList.remove("alert"); });
    var stopLoop = loop(function (dt) {
      if (over) return;
      clock -= dt;
      if (clock <= 0) {
        if (state === "away") { setState("turn"); clock = 0.6; }
        else if (state === "turn") { setState("look"); clock = rand(1.1, 1.8); }
        else { setState("away"); clock = rand(1.3, 2.6); }
      }
      if (freeze > 0) freeze -= dt;
      var moving = holding && freeze <= 0;
      if (moving && state === "look") {
        spotted++;
        show();
        freeze = 1;
        progress = Math.max(0, progress - 12);
        flash(layer, t(G.creep.spotted));
        moving = false;
      } else if (moving) {
        progress = Math.min(100, progress + 16 * dt);
      }
      player.classList.toggle("moving", moving);
      fillEl.style.width = progress + "%";
      var k = progress / 100;
      player.style.left = (12 + k * 40) + "%";
      player.style.bottom = (52 - k * 44) + "%";
      if (progress >= 100) {
        over = true;
        player.classList.remove("moving");
        if (watcher) watcher.classList.remove("alert");
        timers.push(setTimeout(function () { done({ spotted: spotted }); }, 500));
      }
    });
    return cleanup(stopLoop, timers, offs);
  };

  GAMES.kindle = function (layer, status, done) {
    layer.innerHTML = '<div class="mg-bar"><span class="mg-fill"></span></div><div class="mg-sticks">' + STICKS_SVG + '</div>';
    var fillEl = layer.querySelector(".mg-fill");
    var sticks = layer.querySelector(".mg-sticks");
    var timers = [], offs = [];
    var heat = 0, last = null, time = 0, over = false, shown = -1;
    function rub(side) {
      if (over) return;
      heat = Math.min(100, heat + (side !== last ? 8 : 1.5));
      last = side;
      sticks.classList.toggle("flip");
      var sp = document.createElement("span");
      sp.className = "spark";
      sp.style.left = rand(46, 54) + "%";
      sp.style.bottom = "17%";
      sp.style.setProperty("--dx", rand(-30, 30) + "px");
      layer.appendChild(sp);
      timers.push(setTimeout(function () { sp.remove(); }, 650));
    }
    app.querySelectorAll("[data-rub]").forEach(function (b) {
      var side = b.getAttribute("data-rub");
      offs.push(listen(b, "pointerdown", function (e) { e.preventDefault(); rub(side); }));
      offs.push(listen(b, "click", function (e) { if (e.detail === 0) rub(side); }));
    });
    offs.push(listen(document, "keydown", function (e) {
      if (e.repeat) return;
      if (e.key === "ArrowLeft" || e.key === "a") rub("L");
      if (e.key === "ArrowRight" || e.key === "d") rub("R");
    }));
    var stopLoop = loop(function (dt) {
      if (over) return;
      time += dt;
      heat = Math.max(0, heat - 11 * dt);
      fillEl.style.width = heat + "%";
      var dec = Math.floor(heat / 10);
      if (dec !== shown) { shown = dec; status.textContent = fill(t(G.kindle.status), { n: dec * 10 }); }
      if (heat >= 99.5 || time > 15) {
        over = true;
        var helped = heat < 99.5;
        sticks.classList.add("lit");
        fillEl.style.width = "100%";
        status.textContent = t(G.kindle.lit);
        timers.push(setTimeout(function () { done({ time: time, assisted: helped }); }, 1000));
      }
    });
    return cleanup(stopLoop, timers, offs);
  };

  GAMES.leap = function (layer, status, done) {
    layer.innerHTML = '<div class="mg-meter"><span class="mg-zone"></span><span class="mg-fill"></span></div>' + playerSprite("leaper");
    var meter = layer.querySelector(".mg-meter .mg-fill");
    var player = layer.querySelector(".mg-player");
    var timers = [], offs = [];
    var tries = 0, best = 0, charging = false, clock = 0, power = 0, busy = false;
    function show() { status.textContent = fill(t(G.leap.status), { n: Math.min(tries + 1, 3), b: Math.round(best) }); }
    show();
    function jump() {
      busy = true;
      tries++;
      var p = power;
      var score = p > 99 ? 55 : p;
      best = Math.max(best, score);
      flash(layer, t(score >= 85 ? G.leap.great : p > 99 ? G.leap.over : G.leap.ok));
      var rise = layer.clientHeight * 0.55 * (score / 100);
      player.style.transition = "transform .42s cubic-bezier(.2, .7, .3, 1)";
      player.style.transform = "translate(-50%, " + (-rise) + "px)";
      timers.push(setTimeout(function () {
        player.style.transition = "transform .38s cubic-bezier(.6, 0, .9, .5)";
        player.style.transform = "translate(-50%, 0)";
      }, 440));
      timers.push(setTimeout(function () {
        power = 0;
        meter.style.height = "0%";
        if (tries >= 3) {
          status.textContent = fill(t(G.leap.status), { n: 3, b: Math.round(best) });
          done({ best: best });
        } else {
          busy = false;
          show();
        }
      }, 1000));
    }
    offs.push(holdInput([app.querySelector("[data-hold]"), layer], [" ", "ArrowUp"],
      function () { if (!busy) { charging = true; clock = 0; } },
      function () { if (charging) { charging = false; jump(); } }));
    var stopLoop = loop(function (dt) {
      if (!charging) return;
      clock += dt;
      power = (1 - Math.cos(clock * Math.PI / 1.2)) / 2 * 100;
      meter.style.height = power + "%";
    });
    return cleanup(stopLoop, timers, offs);
  };

  function startGame() {
    var node = STORY[s.node];
    var layer = document.getElementById("mg");
    var status = document.getElementById("mg-status");
    if (!layer || !status || !GAMES[node.game]) return;
    activeGame = GAMES[node.game](layer, status, function (r) { stopGame(); finishGame(r); });
  }
  function stopGame() {
    if (activeGame) { activeGame.stop(); activeGame = null; }
  }

  /* ---------- Actions ---------- */
  function toast(msg, kind) {
    var el = document.createElement("div");
    el.className = "toast";
    el.setAttribute("data-k", kind || "note");
    el.textContent = msg;
    toastBox.appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }

  function go(id) {
    if (id === "end") { s.screen = "end"; }
    else { s.node = id; s.line = 0; }
  }

  function focusStep() {
    var first = app.querySelector(".choice:not(.locked), .mg-btn");
    var leaf = document.getElementById("leaf");
    var target = first || (leaf && leaf.getAttribute("tabindex") ? leaf : null);
    if (target) target.focus({ preventScroll: true });
  }

  function advance() {
    var node = STORY[s.node];
    var from = s.node;
    if (node.game) return;
    if (s.line < linesOf(node).length - 1) s.line++;
    else if (node.choices) return;
    else go(node.next);
    save();
    var talk = document.getElementById("talk");
    if (s.screen === "play" && s.node === from && talk && !overlay) {
      talk.innerHTML = talkHTML();
      setSpeaking();
      wirePlay();
    } else {
      render();
    }
    focusStep();
  }

  function applyFx(fx, note) {
    var msgs = [];
    if (note) msgs.push([t(note), "note"]);
    var k;
    for (k in fx.b || {}) { s.bonds[k] += fx.b[k]; msgs.push([fill(t(UI.bondUp), { who: t(PEOPLE[k].with), n: fx.b[k] }), k]); }
    for (k in fx.v || {}) { s.virtues[k] += fx.v[k]; msgs.push([fill(t(UI.virtueUp), { v: t(VIRTUES[k]), n: fx.v[k] }), "v"]); }
    for (k in fx.f || {}) s.flags[k] = fx.f[k];
    return msgs;
  }
  function showToasts(msgs) {
    msgs.forEach(function (m, j) { setTimeout(function () { toast(m[0], m[1]); }, j * 160); });
  }

  function choose(i) {
    var node = STORY[s.node];
    var c = node.choices[i];
    if (c.cost && s.lotus < c.cost) { toast(t(UI.notEnough), "lotus"); return; }
    if (c.cost) s.lotus -= c.cost;
    var msgs = applyFx(c.fx || {}, c.toast);
    if (c.cost) msgs.splice(c.toast ? 1 : 0, 0, [fill(t(UI.lotusSpent), { n: c.cost }), "lotus"]);
    s.picks.push([s.node, i]);
    go(c.next);
    save();
    render();
    focusStep();
    showToasts(msgs);
  }

  function finishGame(r) {
    var node = STORY[s.node];
    var out = node.result ? node.result(r) : {};
    var msgs = applyFx(out.fx || {}, out.toast);
    go(node.next);
    save();
    render();
    focusStep();
    showToasts(msgs);
  }

  function newGame(screen) {
    s = fresh({ lang: s.lang, name: s.name });
    s.screen = screen;
    resumeTo = null;
    overlay = false;
    hasSave = screen === "play";
    if (screen === "play") save(); else clearSave();
    render();
    focusStep();
  }

  function wirePlay() {
    var leaf = document.getElementById("leaf");
    if (leaf && !leaf.classList.contains("waiting")) {
      leaf.onclick = advance;
      leaf.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); } };
    }
    var scene = document.getElementById("scene");
    if (scene) scene.onclick = advance;
    app.querySelectorAll("[data-choice]").forEach(function (b) {
      b.onclick = function () { choose(+b.getAttribute("data-choice")); };
    });
  }

  function wire() {
    app.querySelectorAll("[data-lang]").forEach(function (b) {
      b.onclick = function () { s.lang = b.getAttribute("data-lang"); save(); render(); };
    });
    var nameInput = document.getElementById("player-name");
    if (nameInput) nameInput.oninput = function () { s.name = nameInput.value; };
    var begin = document.getElementById("begin");
    if (begin) begin.onclick = function () { newGame("play"); };
    var cont = document.getElementById("continue");
    if (cont) cont.onclick = function () { s.screen = resumeTo || "play"; resumeTo = null; save(); render(); focusStep(); };
    wirePlay();
    var openBonds = document.getElementById("open-bonds");
    if (openBonds) openBonds.onclick = function () {
      overlay = true; render();
      var c = document.getElementById("close-sheet"); if (c) c.focus();
    };
    var closeSheet = document.getElementById("close-sheet");
    if (closeSheet) closeSheet.onclick = function () { overlay = false; render(); focusStep(); };
    var ov = document.getElementById("overlay");
    if (ov) ov.onclick = function (e) { if (e.target === ov) { overlay = false; render(); focusStep(); } };
    var restart = document.getElementById("restart");
    if (restart) restart.onclick = function () { newGame("title"); };
    var again = document.getElementById("again");
    if (again) again.onclick = function () { newGame("title"); };
  }

  document.addEventListener("keydown", function (e) {
    if (overlay && e.key === "Escape") { overlay = false; render(); focusStep(); return; }
    if (s.screen !== "play" || overlay) return;
    var a = document.activeElement;
    if (a && (a.tagName === "BUTTON" || a.tagName === "INPUT" || a.id === "leaf")) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); }
  });

  /* ---------- Boot ---------- */
  function valid(st) { return st && STORY[st.node] && st.bonds && st.virtues; }
  function boot(data) {
    if (data && valid(data.state)) {
      s = Object.assign(fresh(), data.state);
      resumeTo = data.resumeTo || null;
      hasSave = !!data.hasSave;
    } else {
      var saved = load();
      if (valid(saved)) {
        s = Object.assign(fresh(), saved);
        if (saved.screen && saved.screen !== "title") { resumeTo = saved.screen; hasSave = true; }
        s.screen = "title";
      }
    }
    render();
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(function () { return { state: s, resumeTo: resumeTo, hasSave: hasSave }; });
  if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
})();
</script>
</body>
</html>
